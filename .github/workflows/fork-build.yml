name: Fork build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build the Linux x86_64 release binaries from"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgtk-3-dev libasound2-dev libfontconfig1-dev libssl-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release -p designcraft -p designcraft-cli

      - uses: actions/upload-artifact@v4
        with:
          name: designcraft-linux-x86_64
          path: |
            target/release/designcraft
            target/release/designcraft-cli
          if-no-files-found: error
